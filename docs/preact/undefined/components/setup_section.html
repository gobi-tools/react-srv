<!DOCTYPE html>
<html lang="en"><head><meta charSet="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title></title><meta name="description" content="React Srv Official Page"/><meta name="author" content="Gabriel Coman"/><meta name="color-scheme" content="light dark"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/gobi-tools/css-theme@refs/heads/main/dist/theme.default.min.css"/><link rel="stylesheet" href="/res/custom.css"/><link rel="stylesheet" href="/react-srv/res/custom.css"/></head><body><div id="root"><hgroup><h2>Setup</h2></hgroup><p>First, install the latest versions of <a href="/preact/typescript/index.html">react-srv</a> and <a href="https://preactjs.com/">Preact</a>.</p><figure><pre style="display:block;overflow-x:auto;padding:0.5em;color:#000;background:#f8f8ff"><code class="language-bash" style="white-space:pre"><span>npm i react-srv
</span>      
<!-- -->npm i preact
<!-- -->npm i preact-iso
<span>npm i preact-render-to-string </span><span style="color:#408080;font-style:italic"># needed for SSR/SSG</span><span>
</span></code></pre><figcaption>shell</figcaption></figure><p>Then, to make sure Preact is defined correctly at runtime, add the following entries to your <code>tsconfig.json</code> file.</p><figure><pre style="display:block;overflow-x:auto;padding:0.5em;color:#000;background:#f8f8ff"><code class="language-javascript" style="white-space:pre"><span>{
</span><span>  </span><span style="color:#219161">&quot;compilerOptions: {
</span><span style="color:#219161">    ...
</span><span style="color:#219161">    &quot;</span><span>jsx</span><span style="color:#219161">&quot;: &quot;</span><span>react-jsx</span><span style="color:#219161">&quot;,
</span><span style="color:#219161">    &quot;</span><span>jsxImportSource</span><span style="color:#219161">&quot;: &quot;</span><span>preact</span><span style="color:#219161">&quot;,
</span><span style="color:#219161">    &quot;</span><span>paths</span><span style="color:#219161">&quot;: {
</span><span style="color:#219161">      &quot;</span><span>react</span><span style="color:#219161">&quot;: [&quot;</span><span>./node_modules/preact/compat/</span><span style="color:#219161">&quot;],
</span><span style="color:#219161">      &quot;</span><span>react-dom</span><span style="color:#219161">&quot;: [&quot;</span><span>./node_modules/preact/compat/</span><span style="color:#219161">&quot;],
</span><span style="color:#219161">      &quot;</span><span>react-dom</span><span style="color:#408080;font-style:italic">/*&quot;: [&quot;./node_modules/preact/compat/*&quot;]
</span><span style="color:#408080;font-style:italic">    }
</span><span style="color:#408080;font-style:italic">  }
</span><span style="color:#408080;font-style:italic">}</span></code></pre><figcaption>tsconfig.json</figcaption></figure><article class="success"><p role="group"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg><b>Example</b></p><p>Check out a fully set up project <a href="https://github.com/gobi-tools/react-srv/tree/main/demos/preact/ts" target="_blank">here</a>.</p></article></div><script>globalThis.__INITIAL_PROPS__ = {"library":"preact","language":"typescript"};</script><script type="module" src="./setup_section.69d08a.js"></script></body></html>

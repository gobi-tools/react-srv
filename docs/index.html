<!DOCTYPE html><html lang="en"><head><meta charSet="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link rel="preload" as="image" href="GitHub_Invertocat_White.svg"/><title></title><meta name="description" content="React Srv Official Page"/><meta name="author" content="Gabriel Coman"/><meta name="color-scheme" content="light dark"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/gobi-tools/css-theme@refs/heads/main/dist/theme.scholar.min.css"/></head><body><div id="root"><header><div class="hero align-center"><h1>React Srv</h1><p><b>React Srv is a small project that allows you to very quickly serve React pages from an existing route.</b></p><p><a href="https://github.com/gobi-tools/react-srv" target="_blank"><button><img src="GitHub_Invertocat_White.svg" alt="GitHub Logo"/><span>Source</span></button></a></p><br/></div></header><main><section><p>All you need to do is define a React component in a .tsx file:</p><figure><pre><code>export default function Page(props: { title: string }) {
  return &lt;&gt;
    &lt;h1&gt;Hello, world!&lt;/h1&gt;
    &lt;p&gt;Demo time&lt;/p&gt;
  &lt;/&gt;
}</code></pre><figcaption>page.tsx</figcaption></figure><p>And React Srv will render it as static HTML you can send down the wire:</p><figure><pre><code>const app = express();
const react = new ReactSrv();

app.get(&#x27;/&#x27;, (_, res) =&gt; {
  return res.status(200).send(react.render(Page));
});
</code></pre><figcaption>server.tsx</figcaption></figure></section></main></div></body></html>

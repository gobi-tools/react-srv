<!DOCTYPE html>
<html lang="en"><head><meta charSet="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title></title><meta name="description" content="React Srv Official Page"/><meta name="author" content="Gabriel Coman"/><meta name="color-scheme" content="light dark"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/gobi-tools/css-theme@refs/heads/main/dist/theme.scholar.min.css"/><link rel="stylesheet" href="./custom.css"/></head><body><div id="root"><section><h2>Setup</h2><p>Setup is slightly different based on the platform you&#x27;re running:</p><nav><ol><li aria-selected="true"><a>Typescript</a></li><li aria-selected="false"><a>Javascript (ESM)</a></li><li aria-selected="false"><a>Javascript (CJS)</a></li></ol></nav><br/><p>First, install the latest versions of the <code>react-srv</code> library and <a href="https://react.dev/" target="_blank">React</a>:</p><figure><pre><code>npm i react-srv
